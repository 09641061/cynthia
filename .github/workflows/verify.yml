name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make verify
      - run: make test

  race:
    name: Unit tests with race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-race

  integration:
    name: PostgreSQL integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-integration

  deploy:
    name: Trigger Dokploy Deployment
    needs: [unit, race, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04

    steps:
      - name: Trigger Dokploy Webhook
        run: |
          echo "Triggering Dokploy deployment webhook for ref: ${{ github.ref }}..."
          response=$(curl -s -L -w "\n%{http_code}" -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{"ref": "${{ github.ref }}"}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ne 200 ] && [ "$http_code" -ne 201 ]; then
            echo "Error: Failed to trigger Dokploy deployment"
            exit 1
          fi
          echo "Dokploy deployment triggered successfully!"
