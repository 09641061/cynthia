openapi: 3.1.0
info:
  title: Hello World API
  version: 1.0.0
  description: Minimal API contract for the Go service.
servers:
  - url: http://localhost:3000
paths:
  /hello:
    get:
      summary: Get hello world
      operationId: getHello
      responses:
        '200':
          description: Hello world response
          content:
            text/plain:
              schema:
                type: string
              example: hello world
